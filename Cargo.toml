[lints.rust]
deprecated-safe = "warn"
future-incompatible = "warn"
keyword-idents = "warn"
let-underscore = "warn"
missing-debug-implementations = "warn"
missing-docs = "warn"
trivial-numeric-casts = "warn"
unsafe-op-in-unsafe-fn = "warn"
unused = "warn"

[lints.clippy]
collapsible-else-if = "allow"
collapsible-if = "allow"
diverging-sub-expression = "allow"
let-and-return = "allow"
let-unit-value = "allow"
module-inception = "allow"
type-complexity = "allow"
absolute-paths = "warn"
allow-attributes = "warn"
clone-on-ref-ptr = "warn"
dbg-macro = "warn"
derive-partial-eq-without-eq = "warn"
doc-markdown = "warn"
join-absolute-paths = "warn"
large-enum-variant = "warn"
multiple-unsafe-ops-per-block = "warn"
redundant-closure-for-method-calls = "warn"
unchecked-time-subtraction = "warn"
undocumented-unsafe-blocks = "warn"
uninlined-format-args = "warn"
use-self = "warn"
wildcard-imports = "warn"

[package]
name = "vmsh"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Mueller <deso@posteo.net>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/d-e-s-o/vmsh.git"
readme = "README.md"
categories = [
  "command-line-utilities",
  "development-tools",
  "os::linux-apis",
  "virtualization",
]
keywords = [
  "cli",
  "linux",
  "utility",
  "security",
  "virtualization",
]
description = """
Transparently run a shell (or other binary) in a VM.
"""
include = ["src/**/*", "LICENSE-*", "README.md", "init/**/*", "build.rs"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
incremental = false
panic = "abort"
strip = true

[features]
test = []

[build-dependencies]
grev = { version = "0.2" }

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
libc = { version = "0.2" }
libkrun = { version = "1.19", default-features = false }
# Explicitly pin the otherwise transitive `vm-memory` dependency, to fix
# version resolution otherwise resulting in broken build.
_vm-memory_unused = { package = "vm-memory", version = "=0.17.1" }

[dev-dependencies]
libc = { version = "0.2" }
tempfile = { version = "3", default-features = false }
vmsh = { path = ".", features = ["test"] }
